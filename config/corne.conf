# Deep sleep
CONFIG_ZMK_SLEEP=y

# Wireless range and stability
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_CTLR_PHY_2M=n
# ZMK's connection-stability bundle (pairing timing, new LLCP, no 2M PHY)
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Eager debouncing
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=7

# nice!view displays
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_INVERT=y

# USB: plain 6KRO + boot protocol (works in BIOS)
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=n
CONFIG_ZMK_USB_BOOT=y

# Mouse keys
CONFIG_ZMK_POINTING=y
