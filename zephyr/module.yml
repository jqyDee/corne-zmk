# Makes this repo a Zephyr module so the local modules (vendored
# zmk-auto-layer, udo-status) are compiled in. ZMK's build workflow picks this
# file up automatically. Root CMakeLists.txt / Kconfig include each module.
name: corne-zmk
build:
  cmake: .
  kconfig: Kconfig
  settings:
    dts_root: vendor/zmk-auto-layer
